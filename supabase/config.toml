# Supabase project config
# Ref: https://supabase.com/docs/reference/cli/config

project_id = "uhubhqcymxajdonmkthm"

[functions.kakao-auth]
# Kakao redirects users here via GET without any Authorization header.
# Supabase's default JWT verification would reject the request before our
# handler runs, so we must opt out of verification for this public OAuth
# callback endpoint. All user-facing security is enforced inside the function
# (SHA-256 password derivation keyed by KAKAO_REST_API_KEY).
verify_jwt = false

[functions.reward-credit]
# AdMob Server-Side Verification (SSV) callbacks arrive without an
# Authorization header — AdMob signs the query string with ECDSA instead.
# We therefore disable JWT verification and rely on signature verification
# inside the handler (against Google's public key set).
# Sprint 14 TASK-1405.
verify_jwt = false

[functions.translate-event]
# We perform JWT verification manually inside the handler via
# supabase.auth.getUser() so we can return detailed 401/403 bodies and so
# the same request can also enforce Pro-tier subscription gating.
# Sprint 15 TASK-1501.
verify_jwt = false

[functions.revenuecat-webhook]
# RevenueCat → server webhook. Auth is a fixed shared secret in the
# Authorization header (configured in RevenueCat dashboard, stored in
# `supabase secrets` as REVENUECAT_WEBHOOK_SECRET). No Supabase JWT.
# Sprint 18.
verify_jwt = false

[functions.dispatch-notifications]
# space-activity-dispatch cron(매분)이 `Authorization: Bearer <DISPATCH_SECRET>`
# 으로 호출한다 — service_role 키를 Vault 에 넣지 않으려고 v1.1.4 에서 고정
# 시크릿으로 바꿨는데, 그건 **JWT 가 아니라서** 게이트웨이가 핸들러 앞에서
# 401(UNAUTHORIZED_INVALID_JWT_FORMAT)을 낸다. 이 항목이 빠져 있어 그때부터
# 알림 발송이 통째로 멈춰 있었다(2026-09-09 실측: 6시간에 401 이 360건,
# notifications_queue 2건이 08-09 부터 retry_count=0 인 채 방치 — 즉 실패가
# 아니라 핸들러가 그 행을 한 번도 본 적이 없다).
# 핸들러 자체는 DISPATCH_SECRET 을 제대로 검사한다 — 고칠 곳은 여기였다.
verify_jwt = false

[functions.weekly-review-batch]
# Invoked only by pg_cron (migrations 035/038) with
# `Authorization: Bearer <weekly_review_secret>` — a random hex from Vault,
# NOT a Supabase JWT. The gateway's default JWT verification would 401 the
# cron call before our handler runs, so verification must be disabled here;
# the handler itself checks WEEKLY_REVIEW_SECRET. This entry was previously
# missing, so a redeploy with the CLI default would have silently broken the
# weekly-review cron.
# ⚠️ 2026-09-09 정정: 여기 괄호로 "smart-reminder 는 항목이 필요 없다 — 그 cron 은
#    service_role 키를 보내므로 정상 JWT 라 기본 검증을 통과한다"고 적혀 있었는데
#    **사실이 아니었다.** 그 cron 은 존재하지 않는 설정 파라미터를 읽고 있어서
#    아무 키도 보내지 못했다. 아래 [functions.smart-reminder] 참고.
verify_jwt = false

[functions.reactivation-push]
# 2026-09-09 — 이 함수는 대시보드에서 verify_jwt=false 로 배포돼 있었는데
# config.toml 에 항목이 없어서, CLI 로 재배포하자 기본값(true)으로 **되돌아갔다.**
# 바로 위 weekly-review-batch 주석이 경고하던 그 함정을 그대로 밟았다 —
# 배포 뒤에는 Management API 로 verify_jwt 를 **되읽어 확인**할 것.
# cron 은 Vault 의 `reactivation_secret` 을 Bearer 로 보내고 핸들러가
# REACTIVATION_SECRET 으로 대조한다. 고정 시크릿은 JWT 가 아니므로 여기서
# 게이트웨이 검증을 꺼야 핸들러까지 닿는다.
verify_jwt = false

[functions.smart-reminder]
# 2026-09-09 — 원래 cron 이 `current_setting('app.service_role_key')` 를 읽었는데
# 그 파라미터가 **존재하지 않아** SQL 단계에서 14/14 실패하고 있었다
# (`unrecognized configuration parameter`). AI 일일 알림이 그동안 한 번도
# 나가지 않았다.
# 고치면서 dispatch-notifications·weekly-review-batch 와 같은 방식으로 통일했다:
# Vault 의 `smart_reminder_secret` 를 Bearer 로 보내고 핸들러가
# SMART_REMINDER_SECRET 으로 대조한다. 고정 시크릿은 JWT 가 아니므로 여기서
# 게이트웨이 검증을 꺼야 핸들러까지 닿는다.
verify_jwt = false

[functions.sync-google-calendar]
# 2026-09-12 — `sync-google-calendar-15min` cron 이 **15분마다 401** 로 실패하고
# 있었다(6시간에 25건, 본문 `UNAUTHORIZED_NO_AUTH_HEADER`). 원인은 함수가 아니라
# 마이그레이션 045 였다: cron 이 Vault 의 `service_role_jwt` 를 읽는데 그 시크릿이
# **등록된 적이 없어** 서브쿼리가 NULL 을 반환했고, `'Bearer ' || NULL` = NULL 이라
# Authorization 헤더가 통째로 사라진 채 나갔다. SQL 은 성공으로 찍혀 조용했다.
# → 074 에서 다른 cron 과 같은 방식(Vault `gcal_sync_secret`)으로 통일했고,
#   그 시크릿이 없으면 마이그레이션이 **큰 소리로 실패**하도록 가드를 넣었다.
#
# 고정 시크릿은 JWT 가 아니므로 게이트웨이 검증을 꺼야 핸들러까지 닿는다.
# manual mode(사용자 호출)는 핸들러 안에서 auth.getUser() 로 직접 검증하고,
# cron mode 는 requireSharedSecret(req, 'GCAL_SYNC_SECRET') 이 막는다.
# 🔴 예전엔 cron mode 에 검증이 **아예 없었다** — verify_jwt=true 를 방어선으로
#    믿었지만 그 게이트는 anon 키를 통과시킨다. 끄기 전에 가드를 먼저 넣었다.
verify_jwt = false
