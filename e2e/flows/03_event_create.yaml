# 03_event_create — 이벤트 생성 골든 패스
#
# 홈 → 캘린더 탭 → FAB(+) 탭 → 제목 입력 → 저장
# 생성된 이벤트가 캘린더에 표시되는지 확인한다.
#
# 선행 조건: 로그인 완료 상태

appId: io.synclink.app
---
# 캘린더 탭으로 이동
- tapOn: "캘린더"
- waitForAnimationToEnd
- takeScreenshot: screenshots/03_calendar_before_create

# FAB(+) 버튼 탭 — accessibilityLabel 또는 텍스트 기반
- tapOn:
    id: "fab-create-event"
    optional: true
- runFlow:
    when:
      notVisible: "새 일정"
    commands:
      # FAB accessibilityLabel로 시도
      - tapOn:
          label: "새 일정 만들기"

- waitForAnimationToEnd
- takeScreenshot: screenshots/03_event_create_form

# 제목 입력
- tapOn:
    text: "제목"
- typeText: "E2E 테스트 이벤트"

- takeScreenshot: screenshots/03_event_title_entered

# 저장
- tapOn:
    label: "저장"
    optional: true
- runFlow:
    when:
      notVisible: "캘린더"
    commands:
      - tapOn:
          text: "저장"

- waitForAnimationToEnd
- takeScreenshot: screenshots/03_event_created
