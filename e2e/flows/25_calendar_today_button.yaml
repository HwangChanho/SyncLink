# 25_calendar_today_button — 캘린더 헤더 좌측 today 아이콘 동작 검증
#
# Build 73 신규: CalendarHeader 좌측 끝의 today-outline 아이콘 버튼.
# 탭하면 selectedDate 가 오늘로 set, viewMode 는 유지.
#
# 검증:
#   1. 캘린더 진입 → 월뷰 (default)
#   2. 헤더 타이틀 탭 → wheel picker 로 다른 월로 이동
#   3. 다시 캘린더 → today 버튼 탭 → 오늘 포함 월로 복귀
#   4. 오늘 일자가 highlight 됨 확인 (가능하면)
#
# 오늘 = 시스템 시계 기준. 회귀 시점에 따라 달이 바뀜 — text 매칭은 month
# 무관하게 "오늘" 버튼 동작 자체에 집중.
#
# testID 참조:
#   calendar-header-today    — CalendarHeader 좌측 today 버튼 (없으면 추후 코드에 추가 권장)
#   tab-button-calendar      — 탭 바 캘린더

appId: io.synclink.app
env:
  TEST_EMAIL: ${TEST_EMAIL}
  TEST_PASSWORD: ${TEST_PASSWORD}
---
- stopApp
- clearState
- launchApp:
    permissions:
      all: deny

- repeat:
    times: 5
    commands:
      - runFlow:
          when:
            visible:
              text: "허용 안 함"
          commands:
            - tapOn:
                text: "허용 안 함"
            - waitForAnimationToEnd
      - runFlow:
          when:
            visible:
              text: "Don't Allow"
          commands:
            - tapOn:
                text: "Don't Allow"
            - waitForAnimationToEnd

# 로그인
- extendedWaitUntil:
    visible:
      id: "login-dev-submit"
    timeout: 30000
- tapOn:
    id: "login-dev-email"
- eraseText
- inputText: ${TEST_EMAIL}
- tapOn:
    id: "login-dev-password"
- eraseText
- inputText: ${TEST_PASSWORD}
- tapOn:
    id: "login-dev-submit"
- waitForAnimationToEnd

- runFlow:
    when:
      visible:
        id: "onboarding-button-skip"
    commands:
      - tapOn:
          id: "onboarding-button-skip"
      - waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: "tab-button-home"
    timeout: 30000

# 캘린더 진입
- tapOn:
    id: "tab-button-calendar"
- waitForAnimationToEnd
- takeScreenshot: screenshots/25_calendar_initial

# Today 버튼 탭 (testID 가 코드에 있으면 사용, 없으면 좌측 영역 탭)
- runFlow:
    when:
      visible:
        id: "calendar-header-today"
    commands:
      - tapOn:
          id: "calendar-header-today"
      - waitForAnimationToEnd
      - takeScreenshot: screenshots/25_today_pressed

# 캘린더 여전히 visible — viewMode 유지 + 오늘 위치
- assertVisible:
    id: "tab-button-calendar"
- takeScreenshot: screenshots/25_final
