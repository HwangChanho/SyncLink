# 01_login_dev — Dev 빌드 이메일 로그인 후 홈 탭 도달
# 환경 변수: TEST_EMAIL, TEST_PASSWORD
#
# 실행:
#   TEST_EMAIL=test@example.com TEST_PASSWORD=secret \
#   maestro --device <UDID> test e2e/flows/01_login_dev.yaml

appId: io.synclink.app
env:
  TEST_EMAIL: ${TEST_EMAIL}
  TEST_PASSWORD: ${TEST_PASSWORD}
---
# Sprint 30: clearState + permissions deny.
# - clearState로 매 회귀 fresh start (이전 로그인 잔존 회피).
# - permissions deny로 RevenueCat/expo-notifications 알림 dialog 자체 안 뜨게.
#   (떠있으면 hierarchy를 가려서 SyncLink assertion fail.)
- stopApp
- clearState
- launchApp:
    permissions:
      all: deny

# 시스템 dialog는 Maestro permissions 설정 외에도 SDK 자체가 런타임에 직접
# 요청할 수 있음 (expo-location, RevenueCat). 떠있으면 hierarchy를 가려서
# 다른 assertion 전부 fail. login-dev-submit testID로 바로 대기 + 그동안
# dialog 보이면 dismiss.
# SDK가 dialog 여러 개를 순차적으로 띄울 수 있음 (location, notifications,
# tracking 등). 최대 5번까지 같은 dismiss 반복.
- repeat:
    times: 5
    commands:
      - runFlow:
          when:
            visible:
              text: "허용 안 함"
          commands:
            - tapOn:
                text: "허용 안 함"
            - waitForAnimationToEnd
      - runFlow:
          when:
            visible:
              text: "Don't Allow"
          commands:
            - tapOn:
                text: "Don't Allow"
            - waitForAnimationToEnd

# Dev 전용 입력 필드 (testID 사용 — locale 무관, ADR-011, 30s timeout)
- extendedWaitUntil:
    visible:
      id: "login-dev-submit"
    timeout: 30000

# 이메일 입력 → Return 키로 onSubmitEditing 트리거
# login.tsx onSubmitEditing: @synclink.test 계정은 직접 signInWithEmail 호출
- tapOn:
    id: "login-dev-email"
- eraseText: 100
- inputText: ${TEST_EMAIL}
- pressKey: enter

- waitForAnimationToEnd

- takeScreenshot: screenshots/01_after_login

# 로그인 후 알림 권한 dialog (이전 launchApp permissions:all과 별개로 RevenueCat/expo-notifications가
# 런타임에 별도로 요청할 수 있음 — Sprint 30에서 발견)
- runFlow:
    when:
      visible:
        text: "허용 안 함"
    commands:
      - tapOn:
          text: "허용 안 함"
- runFlow:
    when:
      visible:
        text: "Don't Allow"
    commands:
      - tapOn:
          text: "Don't Allow"

# Onboarding skip — testID 기반 (text는 RevenueCat 토스트 등으로 hierarchy 누락 위험)
- extendedWaitUntil:
    visible:
      id: "onboarding-button-skip"
    timeout: 30000
    optional: true
- runFlow:
    when:
      visible:
        id: "onboarding-button-skip"
    commands:
      - tapOn:
          id: "onboarding-button-skip"
      - waitForAnimationToEnd

# 닉네임 onboarding skip
- runFlow:
    when:
      visible:
        id: "profile-onboarding-button-skip"
    commands:
      - tapOn:
          id: "profile-onboarding-button-skip"
      - waitForAnimationToEnd

# 홈 탭 도달 확인 (testID 사용 — locale 무관, 30s)
- extendedWaitUntil:
    visible:
      id: "tab-button-home"
    timeout: 30000

- assertVisible:
    id: "tab-button-home"
- assertVisible:
    id: "tab-button-calendar"
- assertVisible:
    id: "tab-button-my"

- takeScreenshot: screenshots/01_home_tab
