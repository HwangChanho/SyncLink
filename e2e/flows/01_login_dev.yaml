# 01_login_dev — Dev 빌드 이메일 로그인 후 홈 탭 도달
# 환경 변수: TEST_EMAIL, TEST_PASSWORD
#
# 실행:
#   TEST_EMAIL=test@example.com TEST_PASSWORD=secret \
#   maestro --device <UDID> test e2e/flows/01_login_dev.yaml

appId: io.synclink.app
env:
  TEST_EMAIL: ${TEST_EMAIL}
  TEST_PASSWORD: ${TEST_PASSWORD}
---
# Sprint 24 R2: clearState 제거 + 더 긴 splash 대기.
# clearState true는 dev client cache 도 reset해서 Metro reconnect 시간 큼.
# 이미 install된 dev APK + Metro fresh 번들이면 stopApp 후 launchApp만으로 충분.
- stopApp
- launchApp:
    permissions:
      all: allow

- extendedWaitUntil:
    visible:
      text: "SyncLink"
    timeout: 30000

# 위치/알림 권한 다이얼로그가 떠 있으면 dismiss (시뮬 fresh install 시)
- runFlow:
    when:
      visible:
        text: "허용 안 함"
    commands:
      - tapOn:
          text: "허용 안 함"
- runFlow:
    when:
      visible:
        text: "Don't allow"
    commands:
      - tapOn:
          text: "Don't allow"

# Dev 전용 입력 필드 (testID 사용 — locale 무관, ADR-011)
- extendedWaitUntil:
    visible:
      id: "login-dev-submit"
    timeout: 10000

# 이메일 입력
- tapOn:
    id: "login-dev-email"
- eraseText
- inputText: ${TEST_EMAIL}

# 비밀번호 입력
- tapOn:
    id: "login-dev-password"
- eraseText
- inputText: ${TEST_PASSWORD}

# 로그인 버튼 탭
- tapOn:
    id: "login-dev-submit"

- waitForAnimationToEnd

- takeScreenshot: screenshots/01_after_login

# 홈 탭 도달 확인 (testID 사용 — locale 무관)
- extendedWaitUntil:
    visible:
      id: "tab-button-home"
    timeout: 15000

- assertVisible:
    id: "tab-button-home"
- assertVisible:
    id: "tab-button-calendar"
- assertVisible:
    id: "tab-button-planner"
- assertVisible:
    id: "tab-button-my"

- takeScreenshot: screenshots/01_home_tab
