# 01_login_dev — Dev 빌드 이메일 로그인 후 홈 탭 도달
# 환경 변수: TEST_EMAIL, TEST_PASSWORD
#
# 실행:
#   TEST_EMAIL=test@example.com TEST_PASSWORD=secret \
#   maestro --device <UDID> test e2e/flows/01_login_dev.yaml

appId: io.synclink.app
env:
  TEST_EMAIL: ${TEST_EMAIL}
  TEST_PASSWORD: ${TEST_PASSWORD}
---
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible:
      text: "SyncLink"
    timeout: 10000

# Dev 전용 이메일 입력 필드가 보일 때까지 대기
- extendedWaitUntil:
    visible:
      text: "이메일로 로그인"
    timeout: 5000

# 이메일 입력
- tapOn:
    label: "이메일 주소 입력"
    optional: true
- runFlow:
    when:
      notVisible:
        label: "이메일 주소 입력"
    commands:
      - tapOn:
          index: 0
          below:
            text: "개발자 로그인"
- eraseText
- inputText: ${TEST_EMAIL}

# 비밀번호 입력
- tapOn:
    label: "비밀번호 입력"
    optional: true
- eraseText
- inputText: ${TEST_PASSWORD}

# 로그인 버튼 탭
- tapOn:
    text: "이메일로 로그인"

- waitForAnimationToEnd

- takeScreenshot: screenshots/01_after_login

# 홈 탭 도달 확인
- extendedWaitUntil:
    visible:
      text: "홈"
    timeout: 15000

- assertVisible: "홈"
- assertVisible: "캘린더"
- assertVisible: "플래너"
- assertVisible: "내 정보"

- takeScreenshot: screenshots/01_home_tab
