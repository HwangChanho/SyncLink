# 01_login_dev — Dev 빌드 이메일 로그인 후 홈 탭 도달
# 환경 변수: TEST_EMAIL, TEST_PASSWORD
#
# 실행:
#   TEST_EMAIL=test@example.com TEST_PASSWORD=secret \
#   maestro --device <UDID> test e2e/flows/01_login_dev.yaml

appId: io.synclink.app
env:
  TEST_EMAIL: ${TEST_EMAIL}
  TEST_PASSWORD: ${TEST_PASSWORD}
---
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible:
      text: "SyncLink"
    timeout: 10000

# Dev 전용 이메일 입력 필드가 보일 때까지 대기 (한/영 bilingual — TASK-007 / ADR-011)
- extendedWaitUntil:
    visible:
      id: "login-dev-submit"
    timeout: 5000

# 이메일 입력 (testID 우선)
- tapOn:
    id: "login-dev-email"
- eraseText
- inputText: ${TEST_EMAIL}

# 비밀번호 입력
- tapOn:
    id: "login-dev-password"
- eraseText
- inputText: ${TEST_PASSWORD}

# 로그인 버튼 탭
- tapOn:
    id: "login-dev-submit"

- waitForAnimationToEnd

- takeScreenshot: screenshots/01_after_login

# 홈 탭 도달 확인 (한/영 bilingual)
- extendedWaitUntil:
    visible:
      text: "홈|Home"
    timeout: 15000

- assertVisible:
    text: "홈|Home"
- assertVisible:
    text: "캘린더|Calendar"
- assertVisible:
    text: "플래너|Planner"
- assertVisible:
    text: "내 정보|My"

- takeScreenshot: screenshots/01_home_tab
