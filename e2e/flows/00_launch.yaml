# 00_launch — 앱 실행 + 로그인 화면 도달 검증
# iOS에서 버튼은 accessibilityLabel로만 노출됨 (text 계층 없음)

appId: io.synclink.app
---
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible:
      text: "SyncLink"
    timeout: 10000

- assertVisible:
    text: "SyncLink"

# 버튼은 accessibilityLabel로 검증
- assertVisible:
    label: "Google로 로그인"
- assertVisible:
    label: "카카오로 로그인"
- assertVisible:
    label: "Apple로 로그인"

- takeScreenshot: screenshots/00_login_screen
