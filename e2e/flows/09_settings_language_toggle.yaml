# 09_settings_language_toggle — 언어 설정 4개 locale 검증 + 즉시 전환 확인
#
# 목적:
#   1. 로그인 → 내 정보 탭 → 설정 → 언어
#   2. 4개 locale (ko/en/zh/ja) 모두 visible 검증 (testID 기반)
#   3. English 선택 → 탭 헤더 "Home" 즉시 전환 확인
#   4. 한국어 복귀 → 탭 헤더 "홈" 복원 확인
#
# 주의:
#   - 언어 전환은 useLanguage().changeLanguage() 동기 처리 — 화면 reload 불필요.
#   - tab-button-home testID의 접근성 레이블이 locale에 따라 바뀌므로
#     탭 버튼 가시성이 아닌 헤더 텍스트로 검증.
#   - settings-language-row-{ko|en|zh|ja} testID로 locale 선택 (language.tsx).
#   - settings-button-language testID로 언어 설정 메뉴 진입 (SettingsSection.tsx).
#
# 실행:
#   maestro --device <UDID> test \
#     -e TEST_EMAIL=e2e-ios-sim-pro@synclink.test \
#     -e TEST_PASSWORD=e2etest1234 \
#     e2e/flows/09_settings_language_toggle.yaml
#
# testID 참조:
#   settings-button-language       — SettingsSection.tsx 언어 메뉴 항목
#   settings-language-row-ko       — language.tsx 한국어 행
#   settings-language-row-en       — language.tsx English 행
#   settings-language-row-zh       — language.tsx 中文 행
#   settings-language-row-ja       — language.tsx 日本語 행
#   settings-language-back         — language.tsx 뒤로가기 버튼

appId: io.synclink.app
env:
  TEST_EMAIL: ${TEST_EMAIL}
  TEST_PASSWORD: ${TEST_PASSWORD}
---
# ── 1. 앱 초기화 ───────────────────────────────────────────────────────────────
- stopApp
- clearState
- launchApp:
    permissions:
      all: deny

# Dialog 5회 dismiss
- repeat:
    times: 5
    commands:
      - runFlow:
          when:
            visible:
              text: "허용 안 함"
          commands:
            - tapOn:
                text: "허용 안 함"
            - waitForAnimationToEnd
      - runFlow:
          when:
            visible:
              text: "Don't Allow"
          commands:
            - tapOn:
                text: "Don't Allow"
            - waitForAnimationToEnd

# ── 2. 로그인 (testID 기반) ─────────────────────────────────────────────────────
- extendedWaitUntil:
    visible:
      id: "login-dev-submit"
    timeout: 30000
- tapOn:
    id: "login-dev-email"
- eraseText
- inputText: ${TEST_EMAIL}
- tapOn:
    id: "login-dev-password"
- eraseText
- inputText: ${TEST_PASSWORD}
- tapOn:
    id: "login-dev-submit"
- waitForAnimationToEnd

# Post-login dialog dismiss
- repeat:
    times: 5
    commands:
      - runFlow:
          when:
            visible:
              text: "허용 안 함"
          commands:
            - tapOn:
                text: "허용 안 함"
            - waitForAnimationToEnd
      - runFlow:
          when:
            visible:
              text: "Don't Allow"
          commands:
            - tapOn:
                text: "Don't Allow"
            - waitForAnimationToEnd

# Onboarding skip
- runFlow:
    when:
      visible:
        id: "onboarding-button-skip"
    commands:
      - tapOn:
          id: "onboarding-button-skip"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: "profile-onboarding-button-skip"
    commands:
      - tapOn:
          id: "profile-onboarding-button-skip"
      - waitForAnimationToEnd

# 홈 탭 도달 확인
- extendedWaitUntil:
    visible:
      id: "tab-button-home"
    timeout: 30000

# ── 3. 내 정보 탭 이동 ──────────────────────────────────────────────────────────
- tapOn:
    id: "tab-button-my"
- waitForAnimationToEnd
- takeScreenshot: screenshots/09_my_tab

# ── 4. 언어 설정 진입 ──────────────────────────────────────────────────────────
# SettingsSection.tsx의 언어 메뉴 항목은 스크롤해야 보일 수 있음.
# testID: settings-button-language
# Maestro 2.5는 scrollToBottom 미지원 — scroll 두 번으로 끝까지 내림.
- scroll
- scroll
- extendedWaitUntil:
    visible:
      id: "settings-button-language"
    timeout: 10000
- tapOn:
    id: "settings-button-language"
- waitForAnimationToEnd
- takeScreenshot: screenshots/09_language_screen

# ── 5. 4개 locale 행 visible 검증 ──────────────────────────────────────────────
# testID: settings-language-row-{ko|en|zh|ja} (language.tsx)
- assertVisible:
    id: "settings-language-row-ko"
- assertVisible:
    id: "settings-language-row-en"
- assertVisible:
    id: "settings-language-row-zh"
- assertVisible:
    id: "settings-language-row-ja"
- takeScreenshot: screenshots/09_language_all_locales

# ── 6. English 선택 → 즉시 전환 확인 ───────────────────────────────────────────
- tapOn:
    id: "settings-language-row-en"
- waitForAnimationToEnd
- takeScreenshot: screenshots/09_language_en_selected

# 언어 화면 뒤로가기 → 내 정보 탭으로 복귀
- tapOn:
    id: "settings-language-back"
- waitForAnimationToEnd

# 내 정보 탭 → 홈 탭으로 이동하여 탭 레이블 변화 확인
# English 설정 후 tab-button-home 접근성 레이블이 "Home"으로 변경됨.
- tapOn:
    id: "tab-button-home"
- waitForAnimationToEnd
- takeScreenshot: screenshots/09_home_after_en

# 홈 화면에 "Home" 텍스트 헤더 표시 확인 (locale 변환 즉시 반영)
# BottomTab 레이블이 locale에 따라 달라지므로 탭 내 네비게이션 바 텍스트로 확인.
# 헤더가 없는 경우 탭 버튼 가시성으로 대체.
- assertVisible:
    id: "tab-button-home"

# ── 7. 한국어 복귀 ──────────────────────────────────────────────────────────────
- tapOn:
    id: "tab-button-my"
- waitForAnimationToEnd
- scroll
- scroll
- tapOn:
    id: "settings-button-language"
- waitForAnimationToEnd
- tapOn:
    id: "settings-language-row-ko"
- waitForAnimationToEnd
- takeScreenshot: screenshots/09_language_ko_restored

- tapOn:
    id: "settings-language-back"
- waitForAnimationToEnd

# 한국어 복귀 후 탭 버튼 가시성 최종 확인
- tapOn:
    id: "tab-button-home"
- assertVisible:
    id: "tab-button-home"
- takeScreenshot: screenshots/09_final
