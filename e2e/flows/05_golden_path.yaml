# 05_golden_path — 전체 골든 패스 (testID 기반, locale 무관)
#
# 완전한 E2E 스모크 테스트:
#   로그인 → 홈 → 캘린더 → 이벤트 생성 → 플래너 → 할일 생성 → My 탭
#
# 자체 로그인 포함 — 단독 실행 가능
#
# 실행:
#   maestro --device 5AA67030-E13E-45DA-B4B5-9B45CBC0AFE5 test \
#     -e TEST_EMAIL=e2e-ios-sim-pro@synclink.test \
#     -e TEST_PASSWORD=e2etest1234 \
#     e2e/flows/05_golden_path.yaml
#
# testID 참조:
#   login-dev-email / login-dev-password / login-dev-submit
#   tab-button-{home,calendar,planner,my}
#   calendar-fab-create, event-create-title-input, event-create-save
#   planner-tab-todo, planner-fab-todo, todo-create-title-input, todo-create-save

appId: io.synclink.app
env:
  TEST_EMAIL: ${TEST_EMAIL}
  TEST_PASSWORD: ${TEST_PASSWORD}
---
# ── 1. 앱 초기화 ───────────────────────────────────────────────────────────────
- stopApp
- clearState
- launchApp:
    permissions:
      all: deny

# Dialog 5회 dismiss (expo-location / RevenueCat / Apple 계정 등 런타임 요청)
- repeat:
    times: 5
    commands:
      - runFlow:
          when:
            visible:
              text: "허용 안 함"
          commands:
            - tapOn:
                text: "허용 안 함"
            - waitForAnimationToEnd
      - runFlow:
          when:
            visible:
              text: "Don't Allow"
          commands:
            - tapOn:
                text: "Don't Allow"
            - waitForAnimationToEnd
      - runFlow:
          when:
            visible:
              text: "닫기"
          commands:
            - tapOn:
                text: "닫기"
            - waitForAnimationToEnd

# ── 2. 로그인 (testID 기반) ────────────────────────────────────────────────────
- extendedWaitUntil:
    visible:
      id: "login-dev-submit"
    timeout: 30000
# 로그인: 이메일 입력 → Return 키로 onSubmitEditing 트리거
# login.tsx onSubmitEditing: @synclink.test 계정은 직접 signInWithEmail('e2etest1234') 호출
# eraseText: 100으로 이전 조합 초기화 후 입력
- tapOn:
    id: "login-dev-email"
- waitForAnimationToEnd
- eraseText: 100
- inputText: ${TEST_EMAIL}
- waitForAnimationToEnd
- takeScreenshot: screenshots/gp_00_email_entered
- pressKey: enter
- waitForAnimationToEnd
- takeScreenshot: screenshots/gp_01_after_login

# Post-login dialog dismiss (5회)
- repeat:
    times: 5
    commands:
      - runFlow:
          when:
            visible:
              text: "허용 안 함"
          commands:
            - tapOn:
                text: "허용 안 함"
            - waitForAnimationToEnd
      - runFlow:
          when:
            visible:
              text: "Don't Allow"
          commands:
            - tapOn:
                text: "Don't Allow"
            - waitForAnimationToEnd

# Onboarding skip (testID)
- runFlow:
    when:
      visible:
        id: "onboarding-button-skip"
    commands:
      - tapOn:
          id: "onboarding-button-skip"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: "profile-onboarding-button-skip"
    commands:
      - tapOn:
          id: "profile-onboarding-button-skip"
      - waitForAnimationToEnd

# ── 3. 홈 탭 도달 확인 ─────────────────────────────────────────────────────────
# RevenueCat Console Error 오버레이 dismiss (suite 실행 시 발생 가능)
- runFlow:
    when:
      visible:
        text: "Dismiss"
    commands:
      - tapOn:
          text: "Dismiss"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "tab-button-home"
    timeout: 30000
- assertVisible:
    id: "tab-button-home"
- assertVisible:
    id: "tab-button-calendar"
- assertVisible:
    id: "tab-button-planner"
- assertVisible:
    id: "tab-button-my"
- takeScreenshot: screenshots/gp_02_home

# ── 4. 탭 네비게이션 (testID 기반) ────────────────────────────────────────────
# tab tap 전후 animation 완료 + 화면 헤더 가시성 명시 대기 (race condition 방지)
- waitForAnimationToEnd
- tapOn:
    id: "tab-button-calendar"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "calendar-screen-header"
    timeout: 20000
- takeScreenshot: screenshots/gp_03_calendar

- waitForAnimationToEnd
- tapOn:
    id: "tab-button-planner"
- waitForAnimationToEnd
# RevenueCat 배너 dismiss
- repeat:
    times: 3
    commands:
      - runFlow:
          when:
            visible:
              text: "RevenueCat"
          commands:
            - swipe:
                direction: UP
                startX: 50%
                startY: 97%
                endY: 85%
            - waitForAnimationToEnd
# 좌표 fallback: 플래너 탭 이동 안 된 경우
- runFlow:
    when:
      notVisible:
        id: "planner-tab-todo"
    commands:
      - tapOn:
          point: "62%, 94%"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "planner-tab-todo"
    timeout: 20000
- takeScreenshot: screenshots/gp_04_planner

- waitForAnimationToEnd
- tapOn:
    id: "tab-button-my"
- waitForAnimationToEnd
- takeScreenshot: screenshots/gp_05_my

- waitForAnimationToEnd
- tapOn:
    id: "tab-button-home"
- waitForAnimationToEnd

# ── 5. 이벤트 생성 ────────────────────────────────────────────────────────────
# calendar-screen-header와 FAB 모두 보일 때까지 대기 후 FAB 탭
- waitForAnimationToEnd
- tapOn:
    id: "tab-button-calendar"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "calendar-screen-header"
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "calendar-fab-create"
    timeout: 15000

# FAB 탭 → 이벤트 생성 화면 진입
- tapOn:
    id: "calendar-fab-create"
- waitForAnimationToEnd

# 제목 입력 (testID, autoFocus)
- extendedWaitUntil:
    visible:
      id: "event-create-title-input"
    timeout: 10000
- tapOn:
    id: "event-create-title-input"
- inputText: "E2E 골든패스 이벤트"
- takeScreenshot: screenshots/gp_06_event_form

# 저장 (testID)
- tapOn:
    id: "event-create-save"
- waitForAnimationToEnd
- takeScreenshot: screenshots/gp_07_event_done

# 캘린더 탭 복귀 확인
- assertVisible:
    id: "tab-button-calendar"

# ── 6. 할일 생성 ──────────────────────────────────────────────────────────────
# planner 탭 전환 — RevenueCat 배너 대응 + 좌표 fallback (04_planner_todo와 동일 패턴)
- waitForAnimationToEnd
- tapOn:
    id: "tab-button-planner"
- waitForAnimationToEnd
# 배너 dismiss
- repeat:
    times: 3
    commands:
      - runFlow:
          when:
            visible:
              text: "RevenueCat"
          commands:
            - swipe:
                direction: UP
                startX: 50%
                startY: 97%
                endY: 85%
            - waitForAnimationToEnd
# 좌표 fallback
- runFlow:
    when:
      notVisible:
        id: "planner-tab-todo"
    commands:
      - tapOn:
          point: "62%, 94%"
      - waitForAnimationToEnd

# 할일 탭 활성화 확인 (testID) — 30s 대기
- extendedWaitUntil:
    visible:
      id: "planner-tab-todo"
    timeout: 30000
- tapOn:
    id: "planner-tab-todo"
- waitForAnimationToEnd

# FAB 탭 → TodoCreateSheet 열기
- tapOn:
    id: "planner-fab-todo"
- waitForAnimationToEnd

# 제목 입력 — Modal 내부 testID 불안정, auto-focus 후 inputText 직접 사용
- inputText: "E2E 골든패스 할일"

# 저장 — Modal 내부이므로 Maestro visible 체크 불안정.
# 키보드가 올라온 상태에서 시트 헤더 저장 버튼 좌표로 직접 탭.
# iPhone 16 기준: 키보드 top ≈ 561pt, 시트 헤더 ≈ 510pt, 저장 버튼 x≈92%, y≈60%
- tapOn:
    point: "92%, 11%"
- waitForAnimationToEnd
- takeScreenshot: screenshots/gp_08_todo_done

# 플래너 탭 복귀 확인
- assertVisible:
    id: "planner-tab-todo"
