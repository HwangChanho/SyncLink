# 04_planner_todo — 플래너 할일 생성 골든 패스 (testID 기반)
#
# 플래너 탭 → 할일 탭 확인 → FAB → 제목 입력 → 저장 → 플래너로 복귀
#
# 자체 로그인 포함 (testID 기반, locale 무관) — 단독 실행 가능
#
# 실행:
#   maestro --device 5AA67030-E13E-45DA-B4B5-9B45CBC0AFE5 test \
#     -e TEST_EMAIL=e2e-ios-sim-pro@synclink.test \
#     -e TEST_PASSWORD="$E2E_PASSWORD" \
#     e2e/flows/04_planner_todo.yaml
#
# testID 참조:
#   planner-tab-todo        — planner.tsx 할일 서브탭 버튼
#   planner-fab-todo        — planner.tsx FAB (할일 탭 활성 시)
#   todo-create-title-input — TodoCreateSheet.tsx 제목 TextInput
#   todo-create-save        — TodoCreateSheet.tsx 헤더 저장 버튼

appId: io.synclink.app
env:
  TEST_EMAIL: ${TEST_EMAIL}
  TEST_PASSWORD: ${TEST_PASSWORD}
---
# ── 앱 초기화 ──────────────────────────────────────────────────────────────────
- stopApp
- clearState
- launchApp:
    permissions:
      all: deny

# Dialog 5회 dismiss (expo-location / RevenueCat / Apple 계정 등 런타임 요청)
- repeat:
    times: 5
    commands:
      - runFlow:
          when:
            visible:
              text: "허용 안 함"
          commands:
            - tapOn:
                text: "허용 안 함"
            - waitForAnimationToEnd
      - runFlow:
          when:
            visible:
              text: "Don't Allow"
          commands:
            - tapOn:
                text: "Don't Allow"
            - waitForAnimationToEnd
      - runFlow:
          when:
            visible:
              text: "닫기"
          commands:
            - tapOn:
                text: "닫기"
            - waitForAnimationToEnd

# ── 로그인 (testID 기반) ────────────────────────────────────────────────────────
- extendedWaitUntil:
    visible:
      id: "login-dev-submit"
    timeout: 30000
# 로그인: 이메일 입력 → Return 키로 onSubmitEditing 트리거
# login.tsx onSubmitEditing: @synclink.test 계정은 직접 signInWithEmail 호출
- tapOn:
    id: "login-dev-email"
- waitForAnimationToEnd
- eraseText: 100
- inputText: ${TEST_EMAIL}
- waitForAnimationToEnd
- pressKey: enter
- waitForAnimationToEnd

# Post-login dialog dismiss (5회)
- repeat:
    times: 5
    commands:
      - runFlow:
          when:
            visible:
              text: "허용 안 함"
          commands:
            - tapOn:
                text: "허용 안 함"
            - waitForAnimationToEnd
      - runFlow:
          when:
            visible:
              text: "Don't Allow"
          commands:
            - tapOn:
                text: "Don't Allow"
            - waitForAnimationToEnd

# Onboarding skip (testID)
- runFlow:
    when:
      visible:
        id: "onboarding-button-skip"
    commands:
      - tapOn:
          id: "onboarding-button-skip"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: "profile-onboarding-button-skip"
    commands:
      - tapOn:
          id: "profile-onboarding-button-skip"
      - waitForAnimationToEnd

# 홈 탭 도달 확인
# RevenueCat Console Error 오버레이 dismiss (suite 실행 시 발생 가능)
- runFlow:
    when:
      visible:
        text: "Dismiss"
    commands:
      - tapOn:
          text: "Dismiss"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "tab-button-home"
    timeout: 30000

# RevenueCat debug 배너가 탭 바를 주기적으로 가릴 수 있음.
# 배너를 위로 스와이프해서 dismiss.
- repeat:
    times: 5
    commands:
      - runFlow:
          when:
            visible:
              text: "RevenueCat"
          commands:
            - swipe:
                direction: UP
                startX: 50%
                startY: 97%
                endY: 85%
            - waitForAnimationToEnd

# ── 플래너 탭으로 이동 ─────────────────────────────────────────────────────────
# 배너 dismiss 후 탭 이동
- waitForAnimationToEnd
# 플래너 진입 — 2026-08-28 UX 단순화로 탭바에서 내려가 "나" 탭 바로가기 경유가 됐다.
- tapOn:
    id: "tab-button-my"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "shortcut-button-planner"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "shortcut-button-planner"
- waitForAnimationToEnd
# 탭 후 배너가 다시 나타나면 dismiss
- repeat:
    times: 3
    commands:
      - runFlow:
          when:
            visible:
              text: "RevenueCat"
          commands:
            - swipe:
                direction: UP
                startX: 50%
                startY: 97%
                endY: 85%
            - waitForAnimationToEnd
- runFlow:
    when:
      notVisible:
        id: "planner-tab-todo"
    commands:
      # 재시도: 플래너 탭 좌표 탭 (3번째 탭, 탭 바 중하단)
      - tapOn:
          point: "62%, 94%"
      - waitForAnimationToEnd

# 할일 서브탭 확인 (기본 활성 상태이나 명시적으로 탭)
# testID: planner-tab-todo (planner.tsx) — 30s로 늘려 transition 완료 보장
- extendedWaitUntil:
    visible:
      id: "planner-tab-todo"
    timeout: 30000
- tapOn:
    id: "planner-tab-todo"
- waitForAnimationToEnd
- takeScreenshot: screenshots/04_planner_before

# ── FAB 탭 → TodoCreateSheet 열기 ─────────────────────────────────────────────
# testID: planner-fab-todo (할일 탭 활성 시 planner.tsx FAB)
- tapOn:
    id: "planner-fab-todo"
- waitForAnimationToEnd
- takeScreenshot: screenshots/04_todo_create_sheet

# ── 할일 제목 입력 ─────────────────────────────────────────────────────────────
# TodoCreateSheet는 Modal 내부에 있어 Maestro hierarchy 탐색 시 testID 접근이
# 불안정함. auto-focus(200ms)가 이미 됐으므로 바로 inputText 시도.
- inputText: "E2E 테스트 할일"
- takeScreenshot: screenshots/04_todo_title_entered

# ── 저장 버튼 탭 ───────────────────────────────────────────────────────────────
# 키보드가 올라온 상태에서 시트 헤더 저장 버튼 좌표 탭.
# 스크린샷 분석: "저장" 버튼 y ≈ 11% (iPhone 16 키보드 올라온 상태)
- tapOn:
    point: "92%, 11%"
- waitForAnimationToEnd
- takeScreenshot: screenshots/04_todo_created

# ── 플래너 탭 복귀 확인 ────────────────────────────────────────────────────────
# 시트 닫힌 후 플래너 탭에 있는지 확인 (testID)
- assertVisible:
    id: "planner-tab-todo"
