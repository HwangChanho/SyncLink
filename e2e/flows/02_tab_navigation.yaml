# 02_tab_navigation — 4개 탭 이동 + 각 화면 렌더링 검증
# 자체 로그인 포함 — 단독 실행 가능

appId: io.synclink.app
---
# ── 로그인 ─────────────────────────────────────────────────────────────────────
- stopApp
- launchApp:
    clearState: false

- waitForAnimationToEnd

# 로그인 화면이 있으면 로그인 진행
- runFlow:
    when:
      visible:
        text: "이메일로 로그인"
    commands:
      - tapOn:
          text: "이메일"
      - eraseText: 50
      - inputText: "e2e@synclink.test"
      - tapOn:
          text: "비밀번호"
      - eraseText: 50
      - inputText: "e2etest1234"
      - tapOn:
          text: "로그인"

- extendedWaitUntil:
    visible:
      text: "오늘 일정"
    timeout: 20000

# ── 탭 네비게이션 검증 ──────────────────────────────────────────────────────────
# 홈 탭 확인
- assertVisible: "홈"
- takeScreenshot: screenshots/02_home_tab

# 캘린더 탭
- tapOn:
    label: "캘린더, 탭"
    optional: true
- runFlow:
    when:
      notVisible:
        label: "캘린더, 탭, 선택됨"
    commands:
      - tapOn:
          text: "캘린더"
- waitForAnimationToEnd
- takeScreenshot: screenshots/02_calendar_tab

# 플래너 탭
- tapOn:
    text: "플래너"
- waitForAnimationToEnd
- assertVisible: "할일"
- takeScreenshot: screenshots/02_planner_tab

# 노트 서브탭
- tapOn:
    text: "노트"
- waitForAnimationToEnd
- takeScreenshot: screenshots/02_planner_notes

# 내 정보 탭
- tapOn:
    text: "내 정보"
- waitForAnimationToEnd
- takeScreenshot: screenshots/02_my_tab

# 홈으로 복귀
- tapOn:
    text: "홈"
- waitForAnimationToEnd
