# 02_tab_navigation — 4개 탭 이동 + 각 화면 렌더링 검증
# 자체 로그인 포함 (testID 기반, locale 무관) — 단독 실행 가능
#
# 실행:
#   maestro --device <UDID> test \
#     -e TEST_EMAIL=e2e-ios-sim-pro@synclink.test \
#     -e TEST_PASSWORD=e2etest1234 \
#     e2e/flows/02_tab_navigation.yaml

appId: io.synclink.app
env:
  TEST_EMAIL: ${TEST_EMAIL}
  TEST_PASSWORD: ${TEST_PASSWORD}
---
# ── 로그인 ─────────────────────────────────────────────────────────────────────
- stopApp
- clearState
- launchApp:
    permissions:
      all: deny

# Dialog 5회 dismiss (expo-location/RevenueCat 등 런타임 요청)
- repeat:
    times: 5
    commands:
      - runFlow:
          when:
            visible:
              text: "허용 안 함"
          commands:
            - tapOn:
                text: "허용 안 함"
            - waitForAnimationToEnd

# 로그인 폼 (testID 기반)
- extendedWaitUntil:
    visible:
      id: "login-dev-submit"
    timeout: 30000
# 이메일 입력 → Return 키로 onSubmitEditing 트리거
# login.tsx onSubmitEditing: @synclink.test 계정은 직접 signInWithEmail 호출
- tapOn:
    id: "login-dev-email"
- eraseText: 100
- inputText: ${TEST_EMAIL}
- pressKey: enter
- waitForAnimationToEnd

# Post-login dialog dismiss
- repeat:
    times: 5
    commands:
      - runFlow:
          when:
            visible:
              text: "허용 안 함"
          commands:
            - tapOn:
                text: "허용 안 함"
            - waitForAnimationToEnd

# Onboarding skip (testID)
- runFlow:
    when:
      visible:
        id: "onboarding-button-skip"
    commands:
      - tapOn:
          id: "onboarding-button-skip"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: "profile-onboarding-button-skip"
    commands:
      - tapOn:
          id: "profile-onboarding-button-skip"
      - waitForAnimationToEnd

# 홈 탭 도달 확인
- extendedWaitUntil:
    visible:
      id: "tab-button-home"
    timeout: 30000

# ── 탭 네비게이션 검증 (testID 기반, locale 무관) ────────────────────────────────
- takeScreenshot: screenshots/02_home_tab

# 캘린더 탭
- tapOn:
    id: "tab-button-calendar"
- waitForAnimationToEnd
- takeScreenshot: screenshots/02_calendar_tab

# 플래너 탭
- tapOn:
    id: "tab-button-planner"
- waitForAnimationToEnd
- takeScreenshot: screenshots/02_planner_tab

# 내 정보 탭
- tapOn:
    id: "tab-button-my"
- waitForAnimationToEnd
- takeScreenshot: screenshots/02_my_tab

# 홈으로 복귀
- tapOn:
    id: "tab-button-home"
- waitForAnimationToEnd
- takeScreenshot: screenshots/02_back_to_home
